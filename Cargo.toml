[workspace]
resolver = "3"
members = [
    "norte-code-agent",
    "norte-code-app",
    "norte-code-client",
    "norte-code-cli",
    "norte-code-protocol",
    "norte-code-wire",
    "norte-code-raep",
    "norte-code-plugin-host",
    "tools/app-smoke",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/JeanVydes/NorteCode"
authors = ["Jean Vides <j@vyde.dev>"]

# Norte Code is a host that sits on top of Norte; it never forks it. Norte is
# pulled over git on the `dev` branch and the exact revision is pinned in
# Cargo.lock, which this application commits.
[workspace.dependencies]
norte = { git = "https://github.com/JeanVydes/Norte.git", branch = "dev", features = ["openai", "anthropic", "gemini", "tools", "media", "mcp", "http"] }
norte-testing = { git = "https://github.com/JeanVydes/Norte.git", branch = "dev" }
norte-mcp = { git = "https://github.com/JeanVydes/Norte.git", branch = "dev" }
norte-tools = { git = "https://github.com/JeanVydes/Norte.git", branch = "dev" }

async-trait = "0.1.89"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-core = "0.3.31"
futures-util = "0.3.31"
globset = "0.4"
ignore = "0.4"
regex = "1"
schemars = "1.1.0"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
serde_norway = "0.9.42"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2.0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "signal", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["limit", "timeout", "trace"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
