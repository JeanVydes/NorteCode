[package]
name = "norte-code-app"
description = "Multiplatform Dioxus application for Norte Code RAEP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["minimal", "launch", "asset", "document"] }
norte-code-client = { path = "../norte-code-client", default-features = false }
norte-code-wire = { path = "../norte-code-wire" }
raep-types = { git = "https://github.com/JeanVydes/RAEP.git", rev = "b34b5b5863082b27f308d02f7ae06074a9fa5dae", package = "raep-types" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ammonia = "4"
pulldown-cmark = "0.13"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "Headers", "Location", "ReadableStream", "ReadableStreamDefaultReader", "Request", "RequestInit", "Response", "Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["json", "stream"] }
uuid = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
uuid = { workspace = true, features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[lints]
workspace = true
