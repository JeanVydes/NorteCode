[package]
name = "norte-code-tui"
description = "The Norte Code terminal interface, built on terminalui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "norte_code_tui"
path = "src/lib.rs"

[[bin]]
name = "norte-code-tui"
path = "src/main.rs"

[dependencies]
terminalui = { git = "https://github.com/JeanVydes/terminalui.git", rev = "90e4ae7410417eed70d693a91323706924f44411" }
ratatui = { version = "0.29", features = ["serde"] }
crossterm = { version = "0.29", features = ["bracketed-paste"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures-util = { workspace = true }
unicode-width = "0.2"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal", "io-util"] }
norte-code-client = { path = "../norte-code-client" }
norte-code-wire = { path = "../norte-code-wire" }
norte-code-protocol = { path = "../norte-code-protocol" }

[lints]
workspace = true
