[package]
name = "norte-code-tui"
description = "The Norte Code terminal interface, built on terminalui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "norte_code_tui"
path = "src/lib.rs"

[[bin]]
name = "norte-code-tui"
path = "src/main.rs"

[dependencies]
terminalui = { git = "https://github.com/JeanVydes/terminalui.git", rev = "2497c2f4e0c5aa2a58fe0bbd3c0d0557f591ff9a" }
# Wayland's data-control backend is required to read native Wayland apps.
arboard = { version = "3", features = ["image-data", "wayland-data-control"] }
base64.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.17"
pulldown-cmark = "0.13"
ratatui = { version = "0.29", features = ["serde"] }
crossterm = { version = "0.29", features = ["bracketed-paste"] }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
signal-hook = { workspace = true }
rustix = { version = "1", features = ["fs"] }
thiserror = { workspace = true }
futures-util = { workspace = true }
unicode-width = "0.2"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal", "io-util"] }
norte-code-client = { path = "../norte-code-client" }
norte-code-wire = { path = "../norte-code-wire" }
norte-code-protocol = { path = "../norte-code-protocol" }

[lints]
workspace = true
