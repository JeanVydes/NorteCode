[package]
name = "norte-code-cli"
description = "The headless norte-code command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "norte-code"
path = "src/main.rs"

[dependencies]
norte-code-agent = { path = "../norte-code-agent" }
norte-code-catalog = { path = "../norte-code-catalog" }
norte-code-commands = { path = "../norte-code-commands" }
norte-code-config = { path = "../norte-code-config" }
norte-code-cost = { path = "../norte-code-cost" }
norte-code-plugins = { path = "../norte-code-plugins" }
norte-code-protocol = { path = "../norte-code-protocol" }
norte-code-skills = { path = "../norte-code-skills" }
norte-code-store-sqlite = { path = "../norte-code-store-sqlite" }

clap = { workspace = true }
# The clipboard of a terminal is written through OSC 52, which carries the text
# base64-encoded. There is no clipboard crate here: the only clipboard that
# matters is the one belonging to the terminal a person is looking at.
base64 = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
norte = { workspace = true }
serde_json = { workspace = true }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
tokio = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Pinned to the version ratatui 0.29 depends on. Two crossterms in one binary
# are two readers of the same fd and two owners of the terminal's raw mode: the
# library that draws and the library that reads keys have to be the same one.
crossterm = "0.28"

[dev-dependencies]
norte-testing = { workspace = true }

[lints]
workspace = true
