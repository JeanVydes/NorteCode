name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to publish, for example v0.1.0.
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --bin norte-code

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          staging="dist/norte-code"
          rm -rf dist
          mkdir -p "$staging"
          cp LICENSE README.md "$staging/"
          if [[ "$target" == *windows* ]]; then
            cp "target/$target/release/norte-code.exe" "$staging/norte-code.exe"
            (cd dist && zip -r "../norte-code-$target.zip" "norte-code")
          else
            cp "target/$target/release/norte-code" "$staging/norte-code"
            tar -czf "norte-code-$target.tar.gz" -C dist "norte-code"
          fi
          rm -rf dist

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            norte-code-*.tar.gz
            norte-code-*.zip

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum norte-code-*.tar.gz norte-code-*.zip > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/norte-code-*.tar.gz
            dist/norte-code-*.zip
            dist/SHA256SUMS
